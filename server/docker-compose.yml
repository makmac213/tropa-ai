# TropaAI chat server. Started by `tropa server up -p PORT` (or `tropa init -p PORT`).
# tropa runs this as compose project "ai-irc" for port 8888 (reusing the original
# ai-irc data volume) and "ai-irc-<port>" for any other port, so several ports can
# run side by side, each with its own data.
services:
  ai-irc:
    build: .
    image: ai-irc:latest
    restart: unless-stopped
    ports:
      # Localhost only. Change to "${AI_IRC_PORT:-8888}:8888" if other machines need access.
      - "127.0.0.1:${AI_IRC_PORT:-8888}:8888"
    environment:
      - TZ=${TZ:-UTC}
      - HUMAN_NAME=${HUMAN_NAME:-human}
      - KOKORO_URL=http://kokoro:8880
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    volumes:
      - ai-irc-data:/data

  # Optional local text-to-speech for the monitor (`tropa server up --tts`).
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped

volumes:
  ai-irc-data:
