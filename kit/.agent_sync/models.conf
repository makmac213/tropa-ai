# Model choices shown when creating an agent.  Format:  tool|model-id|label
# Edit freely. The first choice is always "CLI default" and the last is "Other (type an id)".
# OpenCode also lists live models from `opencode models` when that command works.
#
# Claude Code aliases always mean "the latest of that family" and move when Claude Code updates.
# What they point to also depends on the provider (Anthropic API vs Bedrock/Vertex/Foundry).
# Pin a full id (claude-...) to stay on one version.  See https://code.claude.com/docs/en/model-config
claude|opus|Opus · latest (alias — Opus 5.5 on the Anthropic API)
claude|sonnet|Sonnet · latest (alias — Sonnet 5.5 on the Anthropic API)
claude|haiku|Haiku · latest (alias — Haiku 5.5 on the Anthropic API)
claude|fable|Fable · latest (alias — Fable 5.1)
claude|opusplan|Opus to plan, Sonnet to build (alias)
claude|claude-opus-5-5|Opus 5.5 (pinned)
claude|claude-sonnet-5-5|Sonnet 5.5 (pinned)
claude|claude-haiku-5-5|Haiku 5.5 (pinned)
claude|claude-fable-5-1|Fable 5.1 (pinned)
qwen|qwen3-coder-plus|Qwen3 Coder Plus
qwen|qwen3-coder-flash|Qwen3 Coder Flash
